##############################################################
# TwinMind — Render Deployment Configuration
# Docs: https://render.com/docs/infrastructure-as-code
##############################################################

services:
  - type: web
    name: twinmind-api
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true

    envVars:
      # Injected automatically by Render from the linked database
      - key: DATABASE_URL
        fromDatabase:
          name: twinmind-db
          property: connectionString

      # Auto-generate a secure secret on first deploy
      - key: SECRET_KEY
        generateValue: true

      # Update this to your Vercel frontend URL after deploying the frontend
      - key: CORS_ORIGINS
        value: '["https://your-app.vercel.app","http://localhost:5173"]'

      - key: FRONTEND_URL
        value: https://your-app.vercel.app

      # Add remaining secrets manually in the Render dashboard:
      # GROQ_API_KEY, GEMINI_API_KEY, YOUTUBE_API_KEY
      # MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM
      # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REDIRECT_URI
      # RECAPTCHA_SECRET_KEY

      - key: DEBUG
        value: "false"

      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  - name: twinmind-db
    databaseName: twinmind
    user: twinmind_user
    plan: free         # upgrade to starter for persistent storage
