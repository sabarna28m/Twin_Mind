<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary meta -->
    <title>TwinMind — AI Learning Platform</title>
    <meta name="description" content="Your AI-powered digital twin for smarter studying. Track progress, detect burnout, and get personalised study plans." />
    <meta name="theme-color" content="#060b18" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TwinMind" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="TwinMind — AI Learning Platform" />
    <meta property="og:description" content="Your AI-powered digital twin for smarter studying." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Theme bootstrap: apply saved theme before React loads to prevent flash -->
    <script>
      (function(){
        try{
          var V=['galaxy-nexus','sakura-dream','inferno','arctic-aurora','nature-pulse','cyberpunk-neo','ocean-intelligence','neural-brain'];
          var M={cosmos:'galaxy-nexus',sakura:'sakura-dream',ember:'inferno',arctic:'arctic-aurora',forest:'nature-pulse','neon-cyberpunk':'cyberpunk-neo',dark:'galaxy-nexus',light:'arctic-aurora'};
          var s=localStorage.getItem('twinmind-theme');
          var t=V.indexOf(s)!==-1?s:M[s]||(M[localStorage.getItem('theme')]||'nature-pulse');
          document.documentElement.setAttribute('data-theme',t);
        }catch(e){}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for PWA support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .catch(() => { /* SW registration failed — app still works */ });
        });
      }
    </script>
  </body>
</html>
