<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="TwinMind logo" role="img" overflow="visible">
  <defs>
    <!-- Left: cyan to blue -->
    <linearGradient id="lg" x1="3" y1="2" x2="30" y2="59" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#4F7CFF"/>
    </linearGradient>
    <!-- Right: purple to pink -->
    <linearGradient id="rg" x1="61" y1="2" x2="34" y2="59" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <!-- Specular sheen left -->
    <radialGradient id="lh" cx="68%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Specular sheen right -->
    <radialGradient id="rh" cx="32%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Node glow filter -->
    <filter id="ng" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Border stroke glow filter -->
    <filter id="bg" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.0" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Clip left hemisphere -->
    <clipPath id="lc">
      <path d="M 32,8 C 28,2 22,0 18,4 C 15,7 13,10 11,9 C 9,8 6,4 4,9 C 1,14 1,22 3,30 C 5,38 6,44 9,48 C 12,53 17,57 22,58 C 26,59 30,59 32,57 L 32,8 Z"/>
    </clipPath>
    <!-- Clip right hemisphere -->
    <clipPath id="rc">
      <path d="M 32,8 C 36,2 42,0 46,4 C 49,7 51,10 53,9 C 55,8 58,4 60,9 C 63,14 63,22 61,30 C 59,38 58,44 55,48 C 52,53 47,57 42,58 C 38,59 34,59 32,57 L 32,8 Z"/>
    </clipPath>
  </defs>

  <!-- LEFT HEMISPHERE -->
  <path d="M 32,8 C 28,2 22,0 18,4 C 15,7 13,10 11,9 C 9,8 6,4 4,9 C 1,14 1,22 3,30 C 5,38 6,44 9,48 C 12,53 17,57 22,58 C 26,59 30,59 32,57 L 32,8 Z" fill="url(#lg)"/>
  <path d="M 32,8 C 28,2 22,0 18,4 C 15,7 13,10 11,9 C 9,8 6,4 4,9 C 1,14 1,22 3,30 C 5,38 6,44 9,48 C 12,53 17,57 22,58 C 26,59 30,59 32,57 L 32,8 Z" fill="url(#lh)"/>
  <!-- Glowing left border arc (no center straight edge) -->
  <path d="M 32,8 C 28,2 22,0 18,4 C 15,7 13,10 11,9 C 9,8 6,4 4,9 C 1,14 1,22 3,30 C 5,38 6,44 9,48 C 12,53 17,57 22,58 C 26,59 30,59 32,57"
        fill="none" stroke="#00D4FF" stroke-width="1.6" stroke-opacity="0.95" stroke-linecap="round" filter="url(#bg)"/>

  <!-- Left circuit network -->
  <g clip-path="url(#lc)">
    <g stroke="#22D3EE" stroke-width="0.9" stroke-opacity="0.82" stroke-linecap="round">
      <line x1="9"  y1="20" x2="29" y2="20"/>
      <line x1="6"  y1="32" x2="29" y2="32"/>
      <line x1="9"  y1="45" x2="29" y2="45"/>
      <line x1="15" y1="20" x2="15" y2="45"/>
      <line x1="23" y1="20" x2="23" y2="32"/>
      <line x1="23" y1="32" x2="29" y2="20"/>
      <line x1="15" y1="32" x2="9"  y2="45"/>
    </g>
    <g filter="url(#ng)">
      <circle cx="9"  cy="20" r="1.4" fill="#00EEFF"/>
      <circle cx="15" cy="20" r="2.2" fill="#00D4FF"/>
      <circle cx="23" cy="20" r="1.7" fill="#4FC3F7"/>
      <circle cx="29" cy="20" r="1.1" fill="#00EEFF"/>
      <circle cx="6"  cy="32" r="1.4" fill="#00EEFF"/>
      <circle cx="15" cy="32" r="2.2" fill="#00D4FF"/>
      <circle cx="23" cy="32" r="1.7" fill="#4FC3F7"/>
      <circle cx="29" cy="32" r="1.1" fill="#00EEFF"/>
      <circle cx="9"  cy="45" r="1.5" fill="#00EEFF"/>
      <circle cx="15" cy="45" r="2.2" fill="#00D4FF"/>
      <circle cx="29" cy="45" r="1.1" fill="#00EEFF"/>
    </g>
  </g>

  <!-- RIGHT HEMISPHERE -->
  <path d="M 32,8 C 36,2 42,0 46,4 C 49,7 51,10 53,9 C 55,8 58,4 60,9 C 63,14 63,22 61,30 C 59,38 58,44 55,48 C 52,53 47,57 42,58 C 38,59 34,59 32,57 L 32,8 Z" fill="url(#rg)"/>
  <path d="M 32,8 C 36,2 42,0 46,4 C 49,7 51,10 53,9 C 55,8 58,4 60,9 C 63,14 63,22 61,30 C 59,38 58,44 55,48 C 52,53 47,57 42,58 C 38,59 34,59 32,57 L 32,8 Z" fill="url(#rh)"/>
  <path d="M 32,8 C 36,2 42,0 46,4 C 49,7 51,10 53,9 C 55,8 58,4 60,9 C 63,14 63,22 61,30 C 59,38 58,44 55,48 C 52,53 47,57 42,58 C 38,59 34,59 32,57"
        fill="none" stroke="#A855F7" stroke-width="1.6" stroke-opacity="0.95" stroke-linecap="round" filter="url(#bg)"/>

  <!-- Right circuit network -->
  <g clip-path="url(#rc)">
    <g stroke="#C084FC" stroke-width="0.9" stroke-opacity="0.82" stroke-linecap="round">
      <line x1="35" y1="20" x2="55" y2="20"/>
      <line x1="35" y1="32" x2="58" y2="32"/>
      <line x1="35" y1="45" x2="55" y2="45"/>
      <line x1="49" y1="20" x2="49" y2="45"/>
      <line x1="41" y1="20" x2="41" y2="32"/>
      <line x1="41" y1="32" x2="35" y2="20"/>
      <line x1="49" y1="32" x2="55" y2="45"/>
    </g>
    <g filter="url(#ng)">
      <circle cx="35" cy="20" r="1.1" fill="#E879F9"/>
      <circle cx="41" cy="20" r="1.7" fill="#C084FC"/>
      <circle cx="49" cy="20" r="2.2" fill="#A855F7"/>
      <circle cx="55" cy="20" r="1.4" fill="#E879F9"/>
      <circle cx="35" cy="32" r="1.1" fill="#E879F9"/>
      <circle cx="41" cy="32" r="1.7" fill="#C084FC"/>
      <circle cx="49" cy="32" r="2.2" fill="#A855F7"/>
      <circle cx="58" cy="32" r="1.4" fill="#E879F9"/>
      <circle cx="35" cy="45" r="1.1" fill="#E879F9"/>
      <circle cx="49" cy="45" r="2.2" fill="#A855F7"/>
      <circle cx="55" cy="45" r="1.5" fill="#E879F9"/>
    </g>
  </g>

  <!-- Interhemispheric fissure (dashed center split) -->
  <line x1="32" y1="8" x2="32" y2="57"
        stroke="rgba(255,255,255,0.28)" stroke-width="1.4"
        stroke-dasharray="3 2.5" stroke-linecap="round"/>

  <!-- Gyri fold hints on outer lobe edges -->
  <path d="M 20,3 C 19.5,2 18.5,1.5 17.5,2.5" fill="none" stroke="#22D3EE" stroke-width="0.8" stroke-opacity="0.6" stroke-linecap="round"/>
  <path d="M 11,8 C 10.5,7 9.5,6.5 8.5,7.5"  fill="none" stroke="#22D3EE" stroke-width="0.8" stroke-opacity="0.5" stroke-linecap="round"/>
  <path d="M 44,3 C 44.5,2 45.5,1.5 46.5,2.5" fill="none" stroke="#C084FC" stroke-width="0.8" stroke-opacity="0.6" stroke-linecap="round"/>
  <path d="M 53,8 C 53.5,7 54.5,6.5 55.5,7.5" fill="none" stroke="#C084FC" stroke-width="0.8" stroke-opacity="0.5" stroke-linecap="round"/>

  <!-- Brainstem -->
  <path d="M 29.5,57 C 29,59 29.5,62 32,63 C 34.5,62 35,59 34.5,57"
        fill="none" stroke="rgba(255,255,255,0.22)"
        stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
