<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="TwinMind logo" role="img">
  <defs>
    <!-- Left hemisphere: cyan → blue -->
    <linearGradient id="lg" x1="3" y1="9" x2="32" y2="63" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#4F7CFF"/>
    </linearGradient>
    <!-- Right hemisphere: purple → pink -->
    <linearGradient id="rg" x1="61" y1="9" x2="32" y2="63" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <!-- Inner highlight — left -->
    <radialGradient id="lh" cx="65%" cy="22%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Inner highlight — right -->
    <radialGradient id="rh" cx="35%" cy="22%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Node glow filter -->
    <filter id="ng" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Border stroke glow filter -->
    <filter id="bg" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Clip left -->
    <clipPath id="lc">
      <path d="M 32,9 C 26,5 12,6 5,16 C 0,25 1,39 5,50 C 9,59 20,64 28,63 L 32,63 L 32,9 Z"/>
    </clipPath>
    <!-- Clip right -->
    <clipPath id="rc">
      <path d="M 32,9 C 38,5 52,6 59,16 C 64,25 63,39 59,50 C 55,59 44,64 36,63 L 32,63 L 32,9 Z"/>
    </clipPath>
  </defs>

  <!-- ── LEFT HEMISPHERE ── -->
  <path d="M 32,9 C 26,5 12,6 5,16 C 0,25 1,39 5,50 C 9,59 20,64 28,63 L 32,63 L 32,9 Z" fill="url(#lg)"/>
  <path d="M 32,9 C 26,5 12,6 5,16 C 0,25 1,39 5,50 C 9,59 20,64 28,63 L 32,63 L 32,9 Z" fill="url(#lh)"/>
  <path d="M 32,9 C 26,5 12,6 5,16 C 0,25 1,39 5,50 C 9,59 20,64 28,63 L 32,63" fill="none" stroke="#00D4FF" stroke-width="1.3" stroke-opacity="0.9" stroke-linecap="round" filter="url(#bg)"/>

  <!-- Left circuit traces -->
  <g clip-path="url(#lc)">
    <g stroke="#22D3EE" stroke-width="0.85" stroke-opacity="0.85" stroke-linecap="round">
      <line x1="8" y1="21" x2="30" y2="21"/>
      <line x1="5" y1="34" x2="30" y2="34"/>
      <line x1="8" y1="47" x2="30" y2="47"/>
      <line x1="14" y1="21" x2="14" y2="47"/>
      <line x1="22" y1="21" x2="22" y2="34"/>
      <line x1="22" y1="34" x2="30" y2="21"/>
    </g>
    <g filter="url(#ng)">
      <circle cx="8"  cy="21" r="1.4" fill="#00EEFF"/>
      <circle cx="14" cy="21" r="2.0" fill="#00D4FF"/>
      <circle cx="22" cy="21" r="1.6" fill="#4FC3F7"/>
      <circle cx="30" cy="21" r="1.1" fill="#00EEFF"/>
      <circle cx="5"  cy="34" r="1.4" fill="#00EEFF"/>
      <circle cx="14" cy="34" r="2.0" fill="#00D4FF"/>
      <circle cx="22" cy="34" r="1.6" fill="#4FC3F7"/>
      <circle cx="30" cy="34" r="1.1" fill="#00EEFF"/>
      <circle cx="8"  cy="47" r="1.4" fill="#00EEFF"/>
      <circle cx="14" cy="47" r="2.0" fill="#00D4FF"/>
      <circle cx="30" cy="47" r="1.1" fill="#00EEFF"/>
    </g>
  </g>

  <!-- ── RIGHT HEMISPHERE ── -->
  <path d="M 32,9 C 38,5 52,6 59,16 C 64,25 63,39 59,50 C 55,59 44,64 36,63 L 32,63 L 32,9 Z" fill="url(#rg)"/>
  <path d="M 32,9 C 38,5 52,6 59,16 C 64,25 63,39 59,50 C 55,59 44,64 36,63 L 32,63 L 32,9 Z" fill="url(#rh)"/>
  <path d="M 32,9 C 38,5 52,6 59,16 C 64,25 63,39 59,50 C 55,59 44,64 36,63 L 32,63" fill="none" stroke="#A855F7" stroke-width="1.3" stroke-opacity="0.9" stroke-linecap="round" filter="url(#bg)"/>

  <!-- Right circuit traces -->
  <g clip-path="url(#rc)">
    <g stroke="#C084FC" stroke-width="0.85" stroke-opacity="0.85" stroke-linecap="round">
      <line x1="34" y1="21" x2="56" y2="21"/>
      <line x1="34" y1="34" x2="59" y2="34"/>
      <line x1="34" y1="47" x2="56" y2="47"/>
      <line x1="50" y1="21" x2="50" y2="47"/>
      <line x1="42" y1="21" x2="42" y2="34"/>
      <line x1="42" y1="34" x2="34" y2="21"/>
    </g>
    <g filter="url(#ng)">
      <circle cx="34" cy="21" r="1.1" fill="#E879F9"/>
      <circle cx="42" cy="21" r="1.6" fill="#C084FC"/>
      <circle cx="50" cy="21" r="2.0" fill="#A855F7"/>
      <circle cx="56" cy="21" r="1.4" fill="#E879F9"/>
      <circle cx="34" cy="34" r="1.1" fill="#E879F9"/>
      <circle cx="42" cy="34" r="1.6" fill="#C084FC"/>
      <circle cx="50" cy="34" r="2.0" fill="#A855F7"/>
      <circle cx="59" cy="34" r="1.4" fill="#E879F9"/>
      <circle cx="34" cy="47" r="1.1" fill="#E879F9"/>
      <circle cx="50" cy="47" r="2.0" fill="#A855F7"/>
      <circle cx="56" cy="47" r="1.4" fill="#E879F9"/>
    </g>
  </g>

  <!-- ── CENTER DIVIDER ── -->
  <line x1="32" y1="9" x2="32" y2="63" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" stroke-dasharray="2.5 2.5" stroke-linecap="round"/>

  <!-- Corpus callosum synapse -->
  <g filter="url(#ng)">
    <circle cx="32" cy="36" r="3.0" fill="#FFFFFF" fill-opacity="0.85"/>
    <circle cx="32" cy="36" r="1.6" fill="#FFFFFF"/>
  </g>

  <!-- Top bridge highlight -->
  <ellipse cx="32" cy="9.5" rx="3.5" ry="1.8" fill="rgba(255,255,255,0.18)"/>
</svg>
