<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none" width="280" height="80">
  <defs>
    <linearGradient id="lg" x1="4" y1="4" x2="38" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="55%" stop-color="#0077DD"/>
      <stop offset="100%" stop-color="#003899"/>
    </linearGradient>
    <linearGradient id="rg" x1="74" y1="4" x2="42" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    <clipPath id="lc">
      <path d="M 38,8 C 30,2 13,4 6,17 C 1,28 2,46 8,58 C 13,70 26,76 38,74 L 38,8 Z"/>
    </clipPath>
    <clipPath id="rc">
      <path d="M 42,8 C 50,2 67,4 74,17 C 79,28 78,46 72,58 C 67,70 54,76 42,74 L 42,8 Z"/>
    </clipPath>
    <filter id="gc">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Left hemisphere -->
  <path d="M 38,8 C 30,2 13,4 6,17 C 1,28 2,46 8,58 C 13,70 26,76 38,74 L 38,8 Z" fill="url(#lg)" opacity="0.9"/>
  <path d="M 38,8 C 30,2 13,4 6,17 C 1,28 2,46 8,58 C 13,70 26,76 38,74" fill="none" stroke="#00D4FF" stroke-width="1.5" stroke-opacity="0.85" stroke-linecap="round" filter="url(#gc)"/>
  <!-- Left circuit -->
  <g clip-path="url(#lc)">
    <g stroke="#22D3EE" stroke-width="1" stroke-opacity="0.9" stroke-linecap="round">
      <line x1="11" y1="24" x2="34" y2="24"/><line x1="8" y1="42" x2="34" y2="42"/>
      <line x1="11" y1="60" x2="34" y2="60"/><line x1="18" y1="24" x2="18" y2="60"/>
      <line x1="26" y1="24" x2="26" y2="42"/>
    </g>
    <g fill="#00EEFF" filter="url(#gc)">
      <circle cx="18" cy="24" r="2.5"/><circle cx="26" cy="24" r="2"/>
      <circle cx="18" cy="42" r="2.5"/><circle cx="26" cy="42" r="2"/>
      <circle cx="18" cy="60" r="2.5"/>
    </g>
  </g>

  <!-- Right hemisphere -->
  <path d="M 42,8 C 50,2 67,4 74,17 C 79,28 78,46 72,58 C 67,70 54,76 42,74 L 42,8 Z" fill="url(#rg)" opacity="0.9"/>
  <path d="M 42,8 C 50,2 67,4 74,17 C 79,28 78,46 72,58 C 67,70 54,76 42,74" fill="none" stroke="#A855F7" stroke-width="1.5" stroke-opacity="0.85" stroke-linecap="round" filter="url(#gc)"/>
  <!-- Right circuit -->
  <g clip-path="url(#rc)">
    <g stroke="#A78BFA" stroke-width="1" stroke-opacity="0.9" stroke-linecap="round">
      <line x1="46" y1="24" x2="69" y2="24"/><line x1="46" y1="42" x2="72" y2="42"/>
      <line x1="46" y1="60" x2="69" y2="60"/><line x1="62" y1="24" x2="62" y2="60"/>
      <line x1="54" y1="24" x2="54" y2="42"/>
    </g>
    <g fill="#C4B5FD" filter="url(#gc)">
      <circle cx="62" cy="24" r="2.5"/><circle cx="54" cy="24" r="2"/>
      <circle cx="62" cy="42" r="2.5"/><circle cx="54" cy="42" r="2"/>
      <circle cx="62" cy="60" r="2.5"/>
    </g>
  </g>

  <!-- Center divider -->
  <line x1="40" y1="8" x2="40" y2="74" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <ellipse cx="40" cy="9.5" rx="5" ry="3" fill="rgba(255,255,255,0.14)"/>

  <!-- Text: TwinMind -->
  <text x="94" y="46" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="900" font-size="30" letter-spacing="-0.8" fill="url(#tg)">TwinMind</text>
  <!-- Text: AI Learning Platform -->
  <text x="95" y="64" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="500" font-size="13" letter-spacing="0.5" fill="#475569">AI Learning Platform</text>
</svg>
