<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="64" height="64">
  <defs>
    <linearGradient id="lg" x1="4" y1="8" x2="30" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="55%" stop-color="#0077DD"/>
      <stop offset="100%" stop-color="#003899"/>
    </linearGradient>
    <linearGradient id="rg" x1="60" y1="8" x2="34" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    <clipPath id="lc">
      <path d="M 30,12 C 24,5 11,7 5,17 C 1,26 2,40 7,50 C 11,60 22,64 30,62 L 30,12 Z"/>
    </clipPath>
    <clipPath id="rc">
      <path d="M 34,12 C 40,5 53,7 59,17 C 63,26 62,40 57,50 C 53,60 42,64 34,62 L 34,12 Z"/>
    </clipPath>
    <filter id="gc">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle for app icon context -->
  <circle cx="32" cy="32" r="32" fill="#060b18"/>

  <!-- Left hemisphere -->
  <path d="M 30,12 C 24,5 11,7 5,17 C 1,26 2,40 7,50 C 11,60 22,64 30,62 L 30,12 Z" fill="url(#lg)" opacity="0.92"/>
  <path d="M 30,12 C 24,5 11,7 5,17 C 1,26 2,40 7,50 C 11,60 22,64 30,62" fill="none" stroke="#00D4FF" stroke-width="1.4" stroke-opacity="0.9" stroke-linecap="round" filter="url(#gc)"/>

  <!-- Left circuit traces -->
  <g clip-path="url(#lc)">
    <g stroke="#22D3EE" stroke-width="0.9" stroke-opacity="0.9" stroke-linecap="round">
      <line x1="10" y1="22" x2="28" y2="22"/>
      <line x1="7" y1="36" x2="28" y2="36"/>
      <line x1="10" y1="50" x2="28" y2="50"/>
      <line x1="16" y1="22" x2="16" y2="50"/>
      <line x1="22" y1="22" x2="22" y2="36"/>
    </g>
    <g fill="#00EEFF" filter="url(#gc)">
      <circle cx="16" cy="22" r="2.1"/>
      <circle cx="22" cy="22" r="1.6"/>
      <circle cx="16" cy="36" r="2.1"/>
      <circle cx="22" cy="36" r="1.6"/>
      <circle cx="16" cy="50" r="2.1"/>
    </g>
  </g>

  <!-- Right hemisphere -->
  <path d="M 34,12 C 40,5 53,7 59,17 C 63,26 62,40 57,50 C 53,60 42,64 34,62 L 34,12 Z" fill="url(#rg)" opacity="0.92"/>
  <path d="M 34,12 C 40,5 53,7 59,17 C 63,26 62,40 57,50 C 53,60 42,64 34,62" fill="none" stroke="#A855F7" stroke-width="1.4" stroke-opacity="0.9" stroke-linecap="round" filter="url(#gc)"/>

  <!-- Right circuit traces -->
  <g clip-path="url(#rc)">
    <g stroke="#A78BFA" stroke-width="0.9" stroke-opacity="0.9" stroke-linecap="round">
      <line x1="36" y1="22" x2="54" y2="22"/>
      <line x1="36" y1="36" x2="57" y2="36"/>
      <line x1="36" y1="50" x2="54" y2="50"/>
      <line x1="48" y1="22" x2="48" y2="50"/>
      <line x1="42" y1="22" x2="42" y2="36"/>
    </g>
    <g fill="#C4B5FD" filter="url(#gc)">
      <circle cx="48" cy="22" r="2.1"/>
      <circle cx="42" cy="22" r="1.6"/>
      <circle cx="48" cy="36" r="2.1"/>
      <circle cx="42" cy="36" r="1.6"/>
      <circle cx="48" cy="50" r="2.1"/>
    </g>
  </g>

  <!-- Center divider -->
  <line x1="32" y1="12" x2="32" y2="62" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Top highlight -->
  <ellipse cx="32" cy="13" rx="4" ry="2.5" fill="rgba(255,255,255,0.14)"/>
</svg>
